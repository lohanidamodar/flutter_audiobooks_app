name: audiobooks
description: Listora — a Flutter audiobook player backed by archive.org / LibriVox.

publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

  # Audio playback (with lock-screen / notification controls)
  just_audio: ^0.10.5
  just_audio_background: ^0.0.1-beta.17

  # Background file downloads (resume / pause / cancel / progress)
  background_downloader: ^9.5.5

  # Design system — base theme is consumed via the lohanidamodar/popup-bits-design-system monorepo.
  popup_bits_design:
    git:
      url: https://github.com/lohanidamodar/popup-bits-design-system
      ref: main
      path: packages/popup_bits_design
  google_fonts: ^6.2.1

  # Data & persistence
  http: ^1.2.2
  cached_network_image: ^3.4.1
  palette_generator: ^0.3.3+7
  path: ^1.9.0
  path_provider: ^2.1.4
  flutter_riverpod: ^3.3.1
  rxdart: ^0.28.0
  shared_preferences: ^2.3.2
  sqflite: ^2.4.0
  url_launcher: ^6.3.2
  share_plus: ^13.1.0
  package_info_plus: ^10.1.0
  flutter_phosphor_icons: ^0.0.1+6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#14110E"
  adaptive_icon_background: "#14110E"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
  fonts:
    - family: Aleo
      fonts:
        - asset: assets/fonts/Aleo-Regular.ttf
        - asset: assets/fonts/Aleo-Italic.ttf
          style: italic
        - asset: assets/fonts/Aleo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Aleo-Light.ttf
          weight: 300
    - family: Slabo
      fonts:
        - asset: assets/fonts/Slabo27px-Regular.ttf
