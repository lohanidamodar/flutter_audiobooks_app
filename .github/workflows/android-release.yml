# =============================================================
# Android Release — manual trigger
# =============================================================
# Builds a Flutter Android App Bundle and uploads it to Google
# Play via Fastlane. Triggered manually from the GitHub Actions
# UI; the operator picks which Play Store track to publish to.
#
# Required secrets (Settings -> Secrets and variables -> Actions):
#   PLAY_STORE_JSON_KEY_DATA   (org-level) Base64 Google Play
#                              service account JSON key.
#   ANDROID_KEYSTORE_BASE64    Base64-encoded release keystore.
#   ANDROID_KEYSTORE_PASSWORD  Keystore password.
#   ANDROID_KEY_ALIAS          Key alias inside the keystore.
#   ANDROID_KEY_PASSWORD       Key password.
#   APP_IDENTIFIER             Android applicationId / package name.
#
# Tip: encode the keystore with
#   base64 -w0 path/to/file    # Linux
#   base64 -i   path/to/file   # macOS
# =============================================================

name: Android Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Play Store track to publish to"
        required: true
        type: choice
        default: internal
        options:
          - internal
          - beta
          - release
      supply_release_status:
        description: "Release status (use 'draft' for first-ever release on a draft app)"
        required: false
        type: choice
        default: completed
        options:
          - completed
          - draft
          - halted
          - inProgress
      flutter_version:
        description: "Flutter version (e.g. 3.44.0) or a channel name (stable/beta/master)"
        required: false
        type: string
        default: stable

jobs:
  android-release:
    name: Build and upload to Play Store (${{ inputs.release_type }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      APP_IDENTIFIER: ${{ secrets.APP_IDENTIFIER }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PLAY_STORE_JSON_KEY_DATA: ${{ secrets.PLAY_STORE_JSON_KEY_DATA }}
      SUPPLY_RELEASE_STATUS: ${{ inputs.supply_release_status }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve Flutter version input
        id: flutter
        run: |
          v='${{ inputs.flutter_version }}'
          case "$v" in
            ''|stable|beta|master|dev)
              echo "channel=${v:-stable}" >> "$GITHUB_OUTPUT"
              echo "version=" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "channel=stable" >> "$GITHUB_OUTPUT"
              echo "version=$v" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ steps.flutter.outputs.channel }}
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true

      - name: Set up Ruby (Fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: android

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app/keystore
          KS="$GITHUB_WORKSPACE/android/app/keystore/upload-keystore.jks"
          # `tr -d '\r\n'` defends against CRLF / wrapped secrets that
          # would otherwise trip the JDK's ASN.1 parser inside Gradle.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > "$KS"
          if [ "$(stat -c%s "$KS")" -lt 1000 ]; then
            echo "Decoded keystore is implausibly small — check ANDROID_KEYSTORE_BASE64." >&2
            exit 1
          fi
          # Absolute storeFile so signing resolves whether the module
          # reads key.properties relative to android/ or android/app.
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n" \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" \
            "$KS" > android/key.properties

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Fastlane ${{ inputs.release_type }}
        working-directory: android
        run: bundle exec fastlane ${{ inputs.release_type }}
